<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001aff"/>
      <stop offset="100%" stop-color="#000cd4"/>
    </linearGradient>
  </defs>

  <!-- Background squircle in brand electric blue -->
  <rect width="128" height="128" rx="28" fill="url(#blueGradient)"/>
  
  <!-- Subtle inner rim light -->
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
  
  <!-- VT Monogram -->
  <text 
    x="64" 
    y="87" 
    fill="#ffffff" 
    font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="64" 
    font-weight="900" 
    letter-spacing="-2px" 
    text-anchor="middle">VT</text>
</svg>
